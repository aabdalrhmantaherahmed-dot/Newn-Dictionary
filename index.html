<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قاموس إنجليزي – عربي</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f6;--card:#fff;--ink:#14213d;--mut:#6a748c;--acc:#2b3a8f;--gold:#b8892b;--line:#d9dfeb;--v:#2b3a8f;--a:#a8731a;--n:#0f766e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1222;--card:#141c33;--ink:#e8ecf7;--mut:#8d98b5;--acc:#8c9cff;--gold:#e0b25a;--line:#232d4a;--v:#8c9cff;--a:#e0b25a;--n:#4fd1c0}}
:root[data-theme="dark"]{--bg:#0c1222;--card:#141c33;--ink:#e8ecf7;--mut:#8d98b5;--acc:#8c9cff;--gold:#e0b25a;--line:#232d4a;--v:#8c9cff;--a:#e0b25a;--n:#4fd1c0}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.6}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:18px 16px 10px;z-index:2;border-bottom:1px solid var(--line)}
.wrap{max-width:620px;margin:0 auto}
h1{margin:0;font:700 1.7rem/1.2 "Fraunces",Georgia,serif;color:var(--ink)}
.sub{color:var(--mut);font-size:.9rem;margin:2px 0 12px}
input{width:100%;box-sizing:border-box;padding:13px 16px;font:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--mut);padding:5px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.chip:focus-visible,.say:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:620px;margin:0 auto;padding:6px 16px 32px}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.w{flex:1;min-width:0}
.en{direction:ltr;text-align:left;font:500 1.2rem/1.3 "Fraunces",Georgia,serif}
.ar{color:var(--acc);font-size:1.05rem}
.tag{font-size:.75rem;padding:1px 9px;border-radius:999px;border:1px solid currentColor}
.tag.v{color:var(--v)}.tag.a{color:var(--a)}.tag.n{color:var(--n)}.tag.c{color:var(--mut)}
.pic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:1.9rem;color:var(--mut)}.say{font-size:1.15rem;flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--acc);display:grid;place-items:center;cursor:pointer}
.say.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
#inst{color:var(--acc)}#ip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:.92rem}#count{color:var(--mut);font-size:.85rem;margin:10px 2px 0}

.star{font-size:1.25rem;flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--gold);display:grid;place-items:center;cursor:pointer}
.star.on{background:var(--gold);color:#fff;border-color:var(--gold)}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.95rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
#nbfab{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;z-index:30;height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--gold);background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer;box-shadow:0 2px 8px #0003}
#nbp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:10px;z-index:30;width:min(250px,72vw);max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px #0005;padding:8px 10px}
#nbp[hidden]{display:none}
.nbt{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;margin-bottom:4px}
.nbt button,.nwh button{border:0;background:transparent;color:var(--mut);font-size:1rem;cursor:pointer;width:30px;height:30px;padding:0}
.nbe{color:var(--mut);font-size:.85rem;padding:8px 0}
.nw{border-top:1px solid var(--line);padding:5px 0}
.nwh{display:flex;align-items:center;gap:2px}
.nwh .nm{flex:1;min-width:0;cursor:pointer;line-height:1.25}
.nwh b{display:block;direction:ltr;text-align:left;font-size:1rem}
.nwh small{display:block;color:var(--mut);font-size:.8rem}
.nl{max-height:130px;overflow:auto;margin-top:4px}
#nbp .nl input{width:100%;height:32px;padding:0 8px;margin:2px 0;font-size:1rem;border-radius:8px;direction:ltr;text-align:left;border:1.5px solid var(--line)}
#nbp .nl input.ok{color:#1a9b4a;border-color:#1a9b4a;background:#1a9b4a22;font-weight:700}
#nbp .nl input.bad{color:#d8362f;border-color:#d8362f;background:#d8362f22;font-weight:700}
.nmore,#nbclr{display:block;width:100%;margin-top:4px;padding:5px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--mut);font:inherit;font-size:.85rem;cursor:pointer}

#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#1b9a86,#16476a);color:#fff;transition:opacity .6s,visibility .6s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
.sp-logo{width:104px;height:104px;border-radius:26px;background:#fff;display:grid;place-items:center;box-shadow:0 12px 32px #0005;animation:pop .6s ease-out}
.sp-logo span{font-size:34px;font-weight:800;color:#1b9a86;letter-spacing:1px}
.sp-logo::after{content:"";position:absolute;}
#splash h1{margin:18px 0 4px;font-size:2rem}
#splash p{margin:0;opacity:.9;direction:ltr}
.sp-bar{width:150px;height:4px;border-radius:4px;background:#ffffff44;overflow:hidden;margin-top:22px}
.sp-bar i{display:block;height:100%;width:0;background:#f5be46;animation:load 1.6s ease forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes load{to{width:100%}}

/* تصميم محسّن */
html[data-theme=light]{--bg:#eaf7f4;--card:#ffffff;--ink:#16324a;--mut:#5c6b7a;--line:#d6e6e3;--acc:#1b9a86;--gold:#e09a1a}
html[data-theme=dark]{--bg:#0f1b24;--card:#1a2b38;--ink:#e6f1f4;--mut:#9fb3bf;--line:#2a3f4d;--acc:#3fc1ab;--gold:#f5be46}
body{background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#1b9a86,#16476a)!important;color:#fff;border-radius:0 0 24px 24px;box-shadow:0 8px 24px #0006;padding-bottom:12px}
header h1{color:#fff}
header .sub{color:#e6f7f4!important}
.chip{border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);transition:.2s}
.chip[aria-pressed=true]{background:linear-gradient(135deg,#1b9a86,#16476a);color:#fff;border-color:transparent}
.row{border-radius:16px;box-shadow:0 3px 12px #0002;margin:8px 0;border:1px solid var(--line);padding:12px;background:var(--card);transition:transform .15s}
.row:active{transform:scale(.985)}
.pic{background:linear-gradient(135deg,#1b9a86,#16476a);color:#fff;border-radius:14px;font-weight:700}
.en{color:var(--ink)}
.star{background:var(--card);border:1.5px solid var(--gold);color:var(--gold)}
.star.on{background:linear-gradient(135deg,#f5be46,#e09a1a);color:#fff}
.say{background:var(--card);border:1px solid var(--line);border-radius:50%}
#nbfab{background:linear-gradient(135deg,#f5be46,#e09a1a);color:#fff;border:0;font-weight:700}
#nbp{border-radius:18px;box-shadow:0 10px 30px #0008;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.nw{border-radius:12px}
#themeb,#aib{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:31;width:40px;height:40px;border-radius:50%;background:var(--card);font-size:18px;cursor:pointer;box-shadow:0 2px 8px #0003;padding:0}
#themeb{left:92px;border:1.5px solid var(--gold)}
#aib{left:142px;border:1.5px solid var(--acc)}
#aip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:10px;z-index:30;width:min(320px,88vw);max-height:70vh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #0008;padding:12px;display:flex;flex-direction:column;gap:8px}
#aip[hidden]{display:none}
.aih{display:flex;justify-content:space-between;align-items:center;font-weight:700}
#aix{border:0;background:transparent;color:var(--mut);font-size:1rem;cursor:pointer}
#aip input,#aip textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;font:inherit;font-size:.95rem}
#aiq{min-height:70px;resize:vertical}
#aisend{border:0;border-radius:10px;padding:10px;background:linear-gradient(135deg,#1b9a86,#16476a);color:#fff;font:inherit;font-weight:700;cursor:pointer}
#aio{white-space:pre-wrap;font-size:.95rem;line-height:1.7;color:var(--ink)}
#splash{background:linear-gradient(-45deg,#1b9a86,#16476a,#0f3b5e,#1b9a86);background-size:300% 300%;animation:bgmove 6s ease infinite}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.sp-logo{animation:spin3d 1.2s ease-out both}
@keyframes spin3d{0%{transform:rotateY(180deg) scale(.4);opacity:0}100%{transform:none;opacity:1}}
#splash h1{animation:rise .8s .5s ease-out both}
#splash p{animation:rise .8s .8s ease-out both}
.sp-bar{animation:rise .6s 1s both}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
</style>

const NAMES={v:"فعل",a:"صفة",n:"اسم",c:"مركبة"};
const D=RAW.split("\n").filter(l=>l.trim()).map(l=>l.split("|"));
const q=document.getElementById("q"),L=document.getElementById("list"),C=document.getElementById("count");
let tag="";
const ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function render(){
  const t=q.value.trim().toLowerCase();
  const r=D.filter(([e,a,g,m])=>(!tag||g===tag)&&(!t||e.includes(t)||a.includes(t)));
  L.innerHTML=r.length?r.map(([e,a,g,m])=>`<div class="row"><div class="pic">${m||e[0].toUpperCase()}</div><div class="w"><div class="en">${e}</div><div class="ar">${a} ${g?`<span class="tag ${g}">${NAMES[g]}</span>`:""}</div></div><button class="star${window.nbHas&&nbHas(e)?" on":""}" data-w="${e}" aria-label="احفظ في الدفتر">${window.nbHas&&nbHas(e)?"★":"☆"}</button><button class="say" data-w="${e}" data-r=".45" aria-label="نطق بطيء">🐢</button><button class="say" data-w="${e}" data-r="1.1" aria-label="نطق سريع">⚡</button></div>`).join(""):'<div class="empty">لا توجد نتيجة</div>';
  C.textContent=r.length+" كلمة";
}
let VO=[];
function loadV(){try{VO=speechSynthesis.getVoices()}catch(e){}}
try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}
function speak(w,b,r){
  const s=window.speechSynthesis;
  if(!s||typeof SpeechSynthesisUtterance==="undefined"){C.textContent="هذا المتصفح لا يدعم النطق، افتح الرابط في Safari أو Chrome";return}
  loadV();s.cancel();s.resume();
  const u=new SpeechSynthesisUtterance(w);
  const v=VO.find(x=>x.lang==="en-US")||VO.find(x=>x.lang&&x.lang.startsWith("en"));
  if(v)u.voice=v;
  u.lang=v?v.lang:"en-US";u.rate=r;
  b.classList.add("on");
  u.onend=()=>b.classList.remove("on");
  u.onerror=()=>{b.classList.remove("on");C.textContent="تعذر تشغيل الصوت، تأكد أن الجوال ليس على الصامت وافتح الرابط في Safari أو Chrome"};
  setTimeout(()=>s.speak(u),50);
}
L.addEventListener("click",e=>{const b=e.target.closest(".say");if(b)speak(b.dataset.w,b,+b.dataset.r)});
document.getElementById("chips").addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(!c)return;tag=c.dataset.t;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));render();
});
q.addEventListener("input",render);render();
document.getElementById("inst").onclick=e=>{e.preventDefault();const p=document.getElementById("ip");
p.innerHTML=/iPhone|iPad/.test(navigator.userAgent)?"آيفون: افتح الرابط في Safari، اضغط زر المشاركة، ثم «إضافة إلى الشاشة الرئيسية».":"أندرويد: افتح الرابط في Chrome، اضغط ⋮ ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».";p.hidden=!p.hidden};

/* الدفتر المصغّر */
(function(){
const $=id=>document.getElementById(id);
let saved=[],prac={},openW=null;
try{saved=JSON.parse(localStorage.getItem("nbw")||"[]");prac=JSON.parse(localStorage.getItem("nbp")||"{}")}catch(e){}
const persist=()=>{try{localStorage.setItem("nbw",JSON.stringify(saved));localStorage.setItem("nbp",JSON.stringify(prac))}catch(e){}};
const key=w=>w.trim().toLowerCase();
const info=w=>D.find(x=>x[0].toLowerCase()===w)||[w,""];
window.nbHas=w=>saved.includes(key(w));
function toast(m){const t=$("toast");t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,1500)}
function check(i,w){const v=i.value.trim().toLowerCase();i.classList.toggle("ok",v!==""&&v===w);i.classList.toggle("bad",v!==""&&v!==w&&!w.startsWith(v))}
function panel(){
  $("cnt").textContent=saved.length;$("nbclr").style.display=saved.length?"block":"none";
  const box=$("nbbox");box.innerHTML="";
  if(!saved.length){box.innerHTML='<div class="nbe">اضغط ☆ بجانب أي كلمة لحفظها هنا، ثم اكتبها 55 مرة للتدريب.</div>';return}
  for(const w of saved){
    const it=info(w),d=document.createElement("div");d.className="nw";
    d.innerHTML='<div class="nwh"><div class="nm"><b></b><small></small></div><button data-a="s" aria-label="نطق بطيء">🐢</button><button data-a="f" aria-label="نطق سريع">⚡</button><button data-a="x" aria-label="حذف">✕</button></div>';
    d.querySelector("b").textContent=it[0];d.querySelector("small").textContent=it[1];
    d.querySelector(".nm").onclick=()=>{openW=openW===w?null:w;panel()};
    d.querySelector('[data-a=s]').onclick=e=>speak(it[0],e.currentTarget,.45);
    d.querySelector('[data-a=f]').onclick=e=>speak(it[0],e.currentTarget,1.1);
    d.querySelector('[data-a=x]').onclick=()=>{saved=saved.filter(x=>x!==w);delete prac[w];if(openW===w)openW=null;persist();panel();render()};
    if(openW===w){
      prac[w]=prac[w]||[];while(prac[w].length<55)prac[w].push("");
      const lines=document.createElement("div");lines.className="nl";
      const addLine=v=>{const i=document.createElement("input");i.type="text";i.value=v;i.autocomplete="off";i.autocapitalize="off";i.spellcheck=false;
        const next=()=>{const all=[...lines.children],k=all.indexOf(i);if(k<all.length-1){all[k+1].focus();all[k+1].scrollIntoView({block:"nearest"})}else i.blur()};
        i.oninput=()=>{prac[w]=[...lines.children].map(x=>x.value);persist();check(i,w);if(i.classList.contains("ok"))next()};
        i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();next()}};
        lines.appendChild(i);check(i,w)};
      prac[w].forEach(addLine);d.appendChild(lines);
      const m=document.createElement("button");m.className="nmore";m.type="button";m.textContent="+ 10 أسطر";
      m.onclick=()=>{for(let n=0;n<10;n++){prac[w].push("");addLine("")}persist()};d.appendChild(m);
    }
    box.appendChild(d);
  }
}
L.addEventListener("click",e=>{const b=e.target.closest(".star");if(!b)return;
  const w=key(b.dataset.w),k=saved.indexOf(w);
  if(k>-1){saved.splice(k,1);delete prac[w];if(openW===w)openW=null}else{saved.push(w);openW=w}
  persist();b.classList.toggle("on",k<0);b.textContent=k<0?"★":"☆";panel();toast(k<0?"أُضيفت إلى دفترك 📓":"أُزيلت من الدفتر")});
